camera:
  index: 0
  width: 640
  height: 480
  fps: 60
  fourcc: MJPG
  startup_timeout_s: 10
  stall_timeout_s: 1
tracking:
  max_hands: 1
  model_complexity: 0
  min_detection_confidence: 0.6
  min_tracking_confidence: 0.6
kinematics:
  neutral_roll_deg: -90
  roll_range_deg: 60
  steering_sign: 1
  deadzone: 0.06
  pinch_closed: 0.15
  pinch_open: 1.1
  fist_enter_ratio: 0.9
  fist_exit_ratio: 1.1
filter:
  min_cutoff: 1.5
  beta: 0.08
  derivative_cutoff: 1.0
outputs:
  gamepad: false
  serial: false
  serial_port: COM3
  serial_baud: 115200
  watchdog_s: 0.15
  heartbeat_s: 0.05
ui:
  overlay: true
  telemetry_path: telemetry.json
  telemetry_interval_s: 0.5
